name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TMPDIR: /tmp

# Only the exact public mirror selects standard GitHub-hosted runners; every
# other repository keeps its private self-hosted runner selection.
jobs:
  checks:
    runs-on: ${{ github.repository == 'noisefloor-oss/sdlc' && 'ubuntu-24.04-arm' || fromJSON('["self-hosted","Linux","ARM64"]') }}
    steps:
      - name: Reject external fork source on persistent runners
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "Import this change into a same-repository branch before running self-hosted CI." >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -timeout 20m
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: Scan vulnerabilities
        run: govulncheck ./...
      - name: Check archive hygiene
        run: SDLC_EXPORT_CHECK=1 go test -run Export ./internal/exportcheck/

  standalone:
    runs-on: ${{ github.repository == 'noisefloor-oss/sdlc' && 'ubuntu-24.04-arm' || fromJSON('["self-hosted","Linux","ARM64"]') }}
    steps:
      - name: Reject external fork source on persistent runners
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "Import this change into a same-repository branch before running self-hosted CI." >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check standalone catalog
        run: |
          temp_dir=$(mktemp -d)
          CGO_ENABLED=0 go build -trimpath -o "$temp_dir/noise-sdlc" ./cmd/noise-sdlc
          cd "$temp_dir"
          "$temp_dir/noise-sdlc" check-catalog
